name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The regression suites measured from the personal exports skip here, because
      # those CSVs are gitignored. That is the point: this job is what a fresh clone
      # sees, so a green run means a clone is green too.
      - run: npm test

      - run: npm run build
